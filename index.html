<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hekysei</title>
    <style>
        body {
            background-color: #1a1a1a; /* Темный фон */
            color: #ffffff; /* Белый текст */
            font-family: 'Courier New', Courier, monospace; /* Моноширинный шрифт для ASCII */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
            color: #1793d1; /* Цвет Arch Linux */
        }

        pre {
            font-size: 10px; /* Размер шрифта для арта, чтобы влезал */
            line-height: 10px;
            color: #1793d1;
            overflow-x: hidden; /* Скрыть горизонтальную прокрутку на мобильных */
        }

        /* Адаптивность для мобильных устройств */
        @media (max-width: 600px) {
            pre {
                font-size: 6px;
                line-height: 6px;
            }
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <h1>Hekysei</h1>

    <pre>
    /\
    /  \
    /    \
    _\     \
    /        \
    /          \
    /     __   \_\
    /     /  \     \
    /__,--'    '--,__\
    </pre>

</body>
</html>
