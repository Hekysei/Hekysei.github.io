<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои тестовые страницы</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 30px;
            color: #ffffff;
            text-align: center;
        }
        .file-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }
        .file-item {
            background-color: #1e1e1e;
            padding: 15px 20px;
            border-radius: 12px;
            text-decoration: none;
            color: #4da6ff;
            font-size: 1.1rem;
            font-weight: 500;
            transition: background 0.2s, transform 0.1s;
            border: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .file-item:hover {
            background-color: #2a2a2a;
            transform: translateY(-2px);
        }
        .file-item::after {
            content: '→';
            color: #666;
            font-weight: normal;
        }
        .loader {
            color: #888;
            font-size: 1rem;
        }
        .error {
            color: #ff6b6b;
            text-align: center;
            font-size: 0.9rem;
            max-width: 300px;
        }
    </style>
</head>
<body>

    <h1>Доступные страницы</h1>
    
    <div id="content" class="loader">Загрузка списка файлов...</div>

    <script>
        // ВАЖНО: Замените эти данные на свои!
        const GITHUB_USERNAME = 'ВАШ_НИКНЕЙМ'; 
        const REPO_NAME = 'ВАШ_НИКНЕЙМ.github.io';

        async function loadFiles() {
            const contentDiv = document.getElementById('content');
            
            try {
                // Запрос к GitHub API для получения списка файлов в корне репозитория
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/`);
                
                if (!response.ok) {
                    throw new Error('Не удалось загрузить список файлов. Проверьте правильность ника и названия репозитория.');
                }

                const files = await response.json();
                
                // Фильтруем: оставляем только .html файлы, исключая сам index.html
                const htmlFiles = files.filter(file => 
                    file.name.endsWith('.html') && file.name !== 'index.html'
                );

                if (htmlFiles.length === 0) {
                    contentDiv.innerHTML = '<p class="loader">В репозитории пока нет других HTML-файлов.</p>';
                    return;
                }

                // Генерируем ссылки
                const listContainer = document.createElement('div');
                listContainer.className = 'file-list';

                htmlFiles.forEach(file => {
                    const a = document.createElement('a');
                    a.href = file.name; // Ссылка на файл в той же директории
                    a.className = 'file-item';
                    a.textContent = file.name.replace('.html', ''); // Убираем расширение для красоты
                    listContainer.appendChild(a);
                });

                // Заменяем лоадер на список
                contentDiv.replaceWith(listContainer);

            } catch (error) {
                console.error(error);
                contentDiv.innerHTML = `<p class="error">Ошибка: ${error.message}</p>`;
            }
        }

        // Запускаем загрузку при открытии страницы
        loadFiles();
    </script>
</body>
</html>
